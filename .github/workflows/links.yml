# After a release is published: copies of its downloads under names without the version
# (Viti-Windows-Setup.exe, Viti-Mac.dmg, Viti-Linux.AppImage), so github.com/ionodev/viti/releases/latest/download/<name> always gives the
# newest one. The README links to these. (The versioned files stay: the updates are found by their names.)
name: Download links

on:
  workflow_run:
    workflows: ['Build and release']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  links:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: |
          set -e
          tag=$(gh release view --json tagName -q .tagName)
          mkdir out && cd out
          gh release download "$tag" -p 'Viti-Setup-*.exe' -p '*-mac.dmg' -p '*-linux-*.AppImage'
          mkdir links
          cp Viti-Setup-*.exe links/Viti-Windows-Setup.exe
          cp Viti-*-mac.dmg links/Viti-Mac.dmg
          cp Viti-*-linux-*.AppImage links/Viti-Linux.AppImage
          gh release upload "$tag" links/* --clobber
          ls -la links
