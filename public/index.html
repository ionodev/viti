<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Viti</title>
<link rel="icon" href="/img/icon-64.png">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/desktop.css">
<link rel="stylesheet" href="/vendor/katex.css">
<script src="/theme.js"></script>
</head>
<body class="loading">
<header id="topbar">
  <button id="menu-btn" class="icon" title="Show or hide the section menu"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5h16M4 12h16M4 17.5h16"/></svg></span></button>
  <div class="titles"><p class="label" id="kind">Board</p><h1 id="title"></h1></div>
  <a class="brand" href="/home" title="All your projects">
    <span class="cairn-mark"></span>
    <span class="brand-name">Viti</span>
  </a>
</header>
<aside id="sidebar">
  <button id="project-btn" class="project-btn" title="Back to all your projects"><span class="pi"></span><span class="pt"><b></b><small></small></span><span class="chev"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h13l-3.5-3.5"/><path d="M18 16H5l3.5 3.5"/></svg></span></span></button>
  <button id="search-btn" class="side-search" title="Search everything (Ctrl+K)"><span>Search…</span><kbd>Ctrl K</kbd></button>
  <div class="branchbar" title="Which branch of the repository you are looking at: its page in each board, and its reports"><label for="branch-view">Branch</label><select id="branch-view"></select></div>
  <div id="projectcat"></div>
  <p class="label">Sections</p>
  <nav id="sections"></nav>
  <div class="side-tools"><button id="add-section" class="link">+ New section</button></div>
  <p class="label">Reports</p>
  <nav id="special"></nav>
  <div class="side-tools"><button id="add-report" class="link">+ New report</button></div>
  <div id="custom"></div>
  <div class="side-tools"><button id="add-category" class="link">+ New category</button></div>
  <div class="side-foot">
    <button id="me" class="me" title="Your GitHub account"></button>
    <button id="settings" class="me" title="Settings"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v2.4M12 18.6V21M3 12h2.4M18.6 12H21M5.6 5.6l1.7 1.7M16.7 16.7l1.7 1.7M5.6 18.4l1.7-1.7M16.7 7.3l1.7-1.7"/></svg></span> Settings</button>
    <button id="keys-btn" class="me" title="Keyboard shortcuts (?)"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M6.5 10h.01M10 10h.01M14 10h.01M17.5 10h.01M7.5 14h9" stroke-width="1.9"/></svg></span> Shortcuts</button>
    <button id="sync" class="sync" title="GitHub backup"></button>
  </div>
</aside>

<main id="main">
  <header class="titlebar">
    <div id="here" class="here"></div>
    <span id="conn" class="conn" hidden title="The connection to Viti was lost. What you do is kept and sent when it is back.">Offline · reconnecting…</span>
    <button id="chat-btn" class="btn small" title="Show or hide the chat">Chat <span id="chat-badge" class="badge" hidden></span></button>
  </header>
  <div id="stage" class="stage"></div>
</main>

<aside id="chat"></aside>
<div id="scrim"></div>

<div id="quote-pop" class="quote-pop" hidden><button id="quote-btn">Quote in chat</button></div>
<div id="toasts"></div>
<div id="fatal" class="fatal" hidden></div>
<script type="module" src="/js/main.js"></script>
</body>
</html>
